<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradBio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Laboratory Flask & Assay Rays -->
  <path d="M26 14 H38 V22 L49 39 C51.5 43 48.5 48 44 48 H20 C15.5 48 12.5 43 15 39 L26 22 Z" fill="url(#gradBio)" opacity="0.15" />
  <path d="M26 14 H38 V22 L49 39 C51.5 43 48.5 48 44 48 H20 C15.5 48 12.5 43 15 39 L26 22 Z" fill="none" stroke="url(#gradBio)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Flask Lip -->
  <line x1="23" y1="14" x2="41" y2="14" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
  
  <!-- Archachatina spiral & reagent meniscus -->
  <path d="M20 38 Q32 32 44 38" stroke="url(#gradAccent)" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <circle cx="32" cy="41" r="3" fill="#10b981" filter="url(#glow)"/>
  <circle cx="25" cy="43" r="1.8" fill="#38bdf8" />
  <circle cx="38" cy="42" r="1.5" fill="#a7f3d0" />
</svg>
